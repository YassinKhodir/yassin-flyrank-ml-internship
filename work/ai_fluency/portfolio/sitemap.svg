<title id="title">Portfolio sitemap: three pages, one review action</title>
<desc id="desc">Home states the claim. Work supplies two cases and their evidence. About explains the owner and links back to Work. The reviewer inspects evidence and gives feedback through the existing GitHub pull request. Contact is an About section, not a fourth page.</desc>
